<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR. SYSTEMS - School OS (Class Journal Engine)</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #00f2fe;
            --text-color: #f0f6fc;
            --border-color: #30363d;
            --danger-color: #ff4b4b;
            --success-color: #00e676;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .system-container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 242, 254, 0.1);
        }

        .brand-header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .brand-header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent-color);
            letter-spacing: 2px;
        }

        .brand-header p {
            margin: 4px 0 0 0;
            font-size: 0.8rem;
            color: #8b949e;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #8b949e;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .student-list {
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }

        .student-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .status-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .btn-present {
            background-color: var(--success-color);
            color: #000;
        }

        .btn-absent {
            background-color: var(--danger-color);
            color: #fff;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="system-container">
    <div class="brand-header">
        <h1>MR. SYSTEMS</h1>
        <p>DIGITAL CLASS JOURNAL & ROLL CALL OS</p>
    </div>

    <!-- Class Journal Section -->
    <div class="form-group">
        <label for="schoolName">Jina la Shule</label>
        <input type="text" id="schoolName" placeholder="Mfano: Mlimani Primary School">
    </div>

    <div class="form-group">
        <label for="className">Darasa</label>
        <select id="className">
            <option>Darasa la 1</option>
            <option>Darasa la 2</option>
            <option>Darasa la 3</option>
            <option>Darasa la 4</option>
            <option>Darasa la 5</option>
            <option>Darasa la 6</option>
            <option>Darasa la 7</option>
            <option>Form 1</option>
            <option>Form 2</option>
            <option>Form 3</option>
            <option>Form 4</option>
            <option>Form 5</option>
            <option>Form 6</option>
        </select>
    </div>

    <div class="form-group">
        <label for="subject">Somo na Mada</label>
        <input type="text" id="subject" placeholder="Mfano: Sayansi - Mfumo wa Chakula">
    </div>

    <div class="form-group">
        <label for="teacherName">Jina la Mwalimu wa Kipindi</label>
        <input type="text" id="teacherName" placeholder="Ingiza jina lako">
    </div>

    <!-- Quick Roll Call Section -->
    <div class="student-list">
        <label>MAHUDHURIO YA WANAFUNZI (Bofya Kubadilisha Status)</label>
        
        <div class="student-item">
            <span>1. Juma Hamisi</span>
            <button class="status-btn btn-present" onclick="toggleStatus(this)">PRESENT</button>
        </div>

        <div class="student-item">
            <span>2. Aisha Salum</span>
            <button class="status-btn btn-present" onclick="toggleStatus(this)">PRESENT</button>
        </div>

        <div class="student-item">
            <span>3. Baraka Emmanuel</span>
            <button class="status-btn btn-present" onclick="toggleStatus(this)">PRESENT</button>
        </div>

        <div class="student-item">
            <span>4. Devota Joseph</span>
            <button class="status-btn btn-present" onclick="toggleStatus(this)">PRESENT</button>
        </div>
    </div>

    <button class="submit-btn" onclick="saveJournal()">RECORD JOURNAL & ATTENDANCE</button>
</div>

<script>
    function toggleStatus(btn) {
        if (btn.classList.contains('btn-present')) {
            btn.classList.remove('btn-present');
            btn.classList.add('btn-absent');
            btn.innerText = 'ABSENT';
        } else {
            btn.classList.remove('btn-absent');
            btn.classList.add('btn-present');
            btn.innerText = 'PRESENT';
        }
    }

    function saveJournal() {
        const school = document.getElementById('schoolName').value;
        const subject = document.getElementById('subject').value;
        const teacher = document.getElementById('teacherName').value;

        if(!school || !subject || !teacher) {
            alert('Tafadhali jaza taarifa zote za Class Journal kabla ya kuhifadhi!');
            return;
        }

        alert('SUCCESS: Class Journal na Mahudhurio Yamehifadhiwa Kwenye Mfumo wa Mr. Systems!');
    }
</script>

</body>
</html>
